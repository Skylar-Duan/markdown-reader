<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1EFEC"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37352F"/>
      <stop offset="100%" stop-color="#1F1E1B"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Paper sheet with folded corner -->
  <g filter="url(#paperShadow)">
    <path d="M 110 96
             L 350 96
             L 416 162
             L 416 416
             L 110 416 Z"
          fill="url(#paperGrad)"/>
    <!-- Folded corner darker triangle -->
    <path d="M 350 96 L 350 162 L 416 162 Z"
          fill="#D9D8D5"/>
    <path d="M 350 96 L 350 162 L 416 162"
          fill="none" stroke="#A8A6A1" stroke-width="2"/>
  </g>

  <!-- "M↓" badge -->
  <g transform="translate(256 286)">
    <text x="0" y="0"
          font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
          font-size="180"
          font-weight="800"
          fill="#37352F"
          text-anchor="middle"
          dominant-baseline="middle"
          letter-spacing="-6">M</text>
    <text x="68" y="20"
          font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
          font-size="100"
          font-weight="700"
          fill="#2F80ED"
          text-anchor="middle"
          dominant-baseline="middle">↓</text>
  </g>

  <!-- Subtle lines hinting at "text" -->
  <g stroke="#9B9A97" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="148" y1="372" x2="280" y2="372"/>
    <line x1="148" y1="392" x2="240" y2="392"/>
  </g>
</svg>
