<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded background (cream paper) -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FBF8F3"/>

  <!-- Document outline -->
  <path d="M 130 100 L 332 100 L 412 180 L 412 412 Q 412 432 392 432 L 130 432 Q 110 432 110 412 L 110 120 Q 110 100 130 100 Z"
        fill="#FFFFFF" stroke="#37352F" stroke-width="16" stroke-linejoin="round"/>

  <!-- Folded corner (top-right, blue accent) -->
  <path d="M 332 100 L 332 180 L 412 180"
        fill="#2F80ED" stroke="#37352F" stroke-width="16" stroke-linejoin="round"/>

  <!-- "MD" title in the empty space left of the folded corner -->
  <text x="160" y="210"
        font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif"
        font-weight="900" font-size="62" fill="#111111" letter-spacing="-2">MD</text>

  <!-- Four text lines representing document body -->
  <rect x="160" y="240" width="220" height="14" rx="7" fill="#9B9A97"/>
  <rect x="160" y="284" width="180" height="14" rx="7" fill="#9B9A97"/>
  <rect x="160" y="328" width="200" height="14" rx="7" fill="#9B9A97"/>
  <rect x="160" y="372" width="120" height="14" rx="7" fill="#9B9A97"/>
</svg>
