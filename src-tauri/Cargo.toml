[package]
name = "markdown-reader"
version = "1.6.0"
description = "A simple, beautiful Markdown reader for Windows"
authors = ["dbwen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markdown_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"

[features]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
